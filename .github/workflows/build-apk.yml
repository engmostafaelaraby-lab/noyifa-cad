
name: Build NOYIFA CAD APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NOYIFA_CAD_Android_Project(2).zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o NOYIFA_CAD_Android_Project.zip -d appsrc

      - name: Build APK
        run: gradle -p appsrc assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOYIFA-CAD-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
